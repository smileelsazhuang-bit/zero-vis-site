    <title>纸灯</title>
    <style>
      /* Critical shell: visible before the Phaser engine has downloaded, then
         naturally covered by its opaque canvas at the same 16:9 bounds. */
      html,
      body,
      #app {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #050607;
      }

      html,
      body {
        position: fixed;
        inset: 0;
      }

      #app {
        position: relative;
        display: grid;
        place-items: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      #initial-loading {
        grid-area: 1 / 1;
        display: grid;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        place-items: center;
        color: #d8cfb8;
        font-family: 'Noto Serif SC', 'Microsoft YaHei', serif;
        letter-spacing: 0.22em;
        background: #050607;
      }

      #initial-loading h1 {
        margin: 0;
        font-size: clamp(1.75rem, 5vw, 3.5rem);
        font-weight: 500;
      }

      #app canvas {
        z-index: 1;
        grid-area: 1 / 1;
        justify-self: start;
        align-self: start;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
      }

      #safe-area-probe {
        position: fixed;
        z-index: -1;
        inset: 0;
        visibility: hidden;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        pointer-events: none;
      }

      #orientation-guide[hidden] {
        display: none;
      }

      #orientation-guide {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        place-items: center;
        padding: calc(2rem + env(safe-area-inset-top, 0px))
          calc(2rem + env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px))
          calc(2rem + env(safe-area-inset-left, 0px));
        color: #eee4d0;
        text-align: center;
        background:
          radial-gradient(circle at 50% 46%, rgb(93 43 36 / 42%), transparent 34%), #090a09;
        font-family: 'Noto Serif SC', 'Microsoft YaHei', serif;
      }

      .orientation-guide-card {
        display: grid;
        justify-items: center;
        gap: 1.5rem;
        max-width: 30rem;
        padding: 2rem 2.25rem;
        border: 1px solid #8d8069;
        background: rgb(25 24 21 / 94%);
        box-shadow: 0 1rem 4rem rgb(0 0 0 / 55%);
      }

      .orientation-phone-icon {
        position: relative;
        width: 4.8rem;
        height: 7.8rem;
        border: 0.28rem solid #d8cfb8;
        border-radius: 0.72rem;
        box-shadow: inset 0 0 0 0.12rem #564b3f;
        animation: turn-phone 1.9s ease-in-out infinite;
      }

      .orientation-phone-icon::after {
        position: absolute;
        bottom: 0.35rem;
        left: 50%;
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 50%;
        background: #d8cfb8;
        content: '';
        transform: translateX(-50%);
      }

      .orientation-lantern {
        position: absolute;
        top: 2.05rem;
        left: 50%;
        width: 1.8rem;
        height: 2.35rem;
        border: 0.12rem solid #e0b37b;
        background: #7f302c;
        box-shadow: 0 0 1rem rgb(180 75 52 / 70%);
        transform: translateX(-50%);
      }

      .orientation-lantern::before,
      .orientation-lantern::after {
        position: absolute;
        left: 50%;
        width: 1.1rem;
        height: 0.12rem;
        background: #e0b37b;
        content: '';
        transform: translateX(-50%);
      }

      .orientation-lantern::before {
        top: -0.35rem;
      }

      .orientation-lantern::after {
        bottom: -0.35rem;
      }

      #orientation-guide-text {
        margin: 0;
        font-size: clamp(1.15rem, 5vw, 1.7rem);
        line-height: 1.6;
        letter-spacing: 0.08em;
      }

      @keyframes turn-phone {
        0%,
        20% {
          transform: rotate(0deg);
        }
        65%,
        100% {
          transform: rotate(90deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .orientation-phone-icon {
          animation: none;
          transform: rotate(90deg);
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CdO9q-3P.js"></script>

    <link rel="modulepreload" crossorigin href="./assets/story-content-BQo2v8pz.js">

  <body>
    <main id="app" aria-label="《纸灯》游戏画面">
      <section id="initial-loading" aria-label="游戏正在加载">
        <h1>纸灯</h1>
      </section>
    </main>
    <section id="orientation-guide" aria-hidden="true" aria-live="assertive" hidden>
      <div class="orientation-guide-card">
        <span class="orientation-phone-icon" aria-hidden="true">
          <span class="orientation-lantern"></span>
        </span>
        <p id="orientation-guide-text">请将手机横过来游玩</p>
      </div>
    </section>
    <section
      id="mobile-touch-controls"
      class="mobile-touch-controls"
      aria-label="触屏操作"
      aria-hidden="true"
      hidden
    >
      <div class="mobile-touch-group mobile-touch-movement" aria-label="移动">
        <button
          id="mobile-touch-left"
          class="mobile-touch-button mobile-touch-direction"
          type="button"
          data-touch-target="left"
          aria-label="向左移动"
          aria-pressed="false"
        >
          <span data-touch-label>◀</span>
        </button>
        <button
          id="mobile-touch-right"
          class="mobile-touch-button mobile-touch-direction"
          type="button"
          data-touch-target="right"
          aria-label="向右移动"
          aria-pressed="false"
        >
          <span data-touch-label>▶</span>
        </button>
      </div>
      <div class="mobile-touch-group mobile-touch-context-actions" aria-label="场景操作">
        <button
          id="mobile-touch-enter"
          class="mobile-touch-button mobile-touch-enter"
          type="button"
          data-touch-target="enter"
          aria-label="进入"
          hidden
        >
          <span data-touch-label>进入</span>
        </button>
        <button
          id="mobile-touch-interact"
          class="mobile-touch-button mobile-touch-interact"
          type="button"
          data-touch-target="interact"
          aria-label="互动"
          aria-disabled="true"
          disabled
        >
          <span data-touch-label>互动</span>
        </button>
      </div>
      <div class="mobile-touch-group mobile-touch-top-actions" aria-label="快捷菜单">
        <button
          id="mobile-touch-inventory"
          class="mobile-touch-button mobile-touch-utility"
          type="button"
          data-touch-target="inventory"
          aria-label="打开物品栏"
        >
          <span data-touch-label>物品</span>
        </button>
        <button
          id="mobile-touch-menu"
          class="mobile-touch-button mobile-touch-utility"
          type="button"
          data-touch-target="menu"
          aria-label="打开菜单"
        >
          <span data-touch-label>≡ 菜单</span>
        </button>
      </div>
      <aside
        id="mobile-touch-tutorial"
        class="mobile-touch-tutorial"
        aria-label="触屏操作引导"
        aria-live="polite"
        hidden
      >
        <div class="mobile-touch-tutorial-card">
          <p>按住 ◀ / ▶ 移动，长按可以慢走。</p>
          <p>靠近目标后点「互动」或「进入」。</p>
          <p>右上角可打开物品和菜单。</p>
          <button
            id="mobile-touch-tutorial-close"
            class="mobile-touch-button mobile-touch-tutorial-close"
            type="button"
            data-touch-target="tutorial-close"
          >
            知道了
          </button>
        </div>
      </aside>
    </section>
    <div id="safe-area-probe" aria-hidden="true"></div>
  </body>
</html>
